{% extends "base.html" %}{% block content %}<h2>My farms</h2><div class="row g-4"><div class="col-lg-5"><div class="card p-3"><h5>Add a farm</h5><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-success">Add farm</button></form></div></div><div class="col-lg-7"><div class="card p-3">{% for f in farms %}<div class="border-bottom py-2"><b>{{ f.name }}</b><div>{{ f.location }} · {{ f.area_acres }} acres · {{ f.soil_type }}</div></div>{% empty %}<p>No farms yet.</p>{% endfor %}</div></div></div>{% endblock %}
