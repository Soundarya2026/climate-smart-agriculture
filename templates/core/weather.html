{% extends "base.html" %}{% block content %}<h2>Weather</h2><div class="card p-4 col-lg-7"><form method="get" class="d-flex gap-2 mb-3"><input class="form-control" name="city" value="{{ city }}" placeholder="Enter city"><button class="btn btn-success">Check</button></form>{% if data %}<h4>{{ data.city }}</h4><h1>{{ data.temperature }}°C</h1><p>{{ data.description }} · Humidity {{ data.humidity }}%</p>{% else %}<div class="alert alert-warning">{{ error }}</div>{% endif %}</div>{% endblock %}
