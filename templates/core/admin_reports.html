{% extends "base.html" %}{% block content %}<h2>Disease reports</h2><div class="card p-3 table-responsive"><table class="table"><tr><th>Farmer</th><th>Crop</th><th>Symptoms</th><th>Status</th><th>Image</th></tr>{% for r in reports %}<tr><td>{{ r.farmer.username }}</td><td>{{ r.crop_name }}</td><td>{{ r.symptoms }}</td><td>{{ r.result }}</td><td>{% if r.image %}<a href="{{ r.image.url }}">Open</a>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
